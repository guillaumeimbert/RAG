name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      # pgvector-backed PostgreSQL 17, pinned to the same tested release as
      # compose.yaml (0.8.6) so CI and local dev use the same pgvector.
      # e2e connects as user "raguesslighter" to the "raguesslighter"
      # database on 127.0.0.1:5432 and creates a scratch database of its own.
      db:
        image: pgvector/pgvector:0.8.6-pg17
        env:
          POSTGRES_USER: raguesslighter
          POSTGRES_PASSWORD: raguesslighter
          POSTGRES_DB: raguesslighter
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U raguesslighter"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      OPAMYES: "1"
      RAG_E2E_REQUIRE_PG: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config \
            libpq-dev libssl-dev zlib1g-dev libffi-dev

      - name: Set up OCaml
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-version: '5.5.0'

      - name: Install OCaml dependencies
        run: |
          # --with-test is required: alcotest is a {with-test} dependency,
          # so the test executables cannot build without it.
          opam install . --deps-only --with-test --yes

      - name: Build
        run: dune build

      - name: Unit tests
        run: ./_build/default/test/test.exe

      - name: End-to-end tests (against Postgres)
        run: |
          # Point the e2e test at the real ingest binary so the CLI
          # exit-code subtest runs.
          export RAG_E2E_INGEST_BIN="$PWD/_build/default/bin/ingest.exe"
          ./_build/default/test/e2e.exe