# Local dev database: Postgres 17 + pgvector for the RAG.
#
#   podman compose up -d        # start (first run pulls the image, ~100 MB)
#   podman compose down         # stop (volume keeps data)
#   podman compose down -v      # stop AND destroy data
#
# NOTE: schema/*.sql runs automatically ONLY on first initialization
# (empty data volume). After that, apply changes with psql or a migration
# tool:  podman compose exec db psql -U raguesslighter -d raguesslighter

services:
  db:
    # Floating tag: always the newest pgvector built for Postgres 17. The
    # application checks the installed pgvector version at startup (it must be
    # >= 0.8.0 for hnsw.iterative_scan) and fails fast otherwise. Pin an
    # explicit version tag (e.g. pg17-0.8.0) for reproducible builds.
    image: pgvector/pgvector:pg17
    # Explicit name so it never collides with other local stacks
    # (podman-compose otherwise derives "rag_db_1" from this directory name).
    container_name: raguesslighter-db
    environment:
      POSTGRES_DB: raguesslighter
      POSTGRES_USER: raguesslighter
      POSTGRES_PASSWORD: raguesslighter
    ports:
      - "5432:5432"
    # The halfvec HNSW index (see schema/0004_halfvec_hnsw.sql) builds its
    # graph in shared memory. Podman's default /dev/shm is 64 MB, which is too
    # small for the build at the reference 2560-dim width ("could not resize
    # shared memory segment ... No space left on device"); shm_size: 1g gives
    # the build room. NOTE: this does NOT raise maintenance_work_mem (still the
    # 64 MB default) -- if the graph exceeds that budget the build simply
    # spills, which SLOWS construction (it does not reduce index quality). To
    # speed up a one-off build: SET maintenance_work_mem = '1GB' before
    # CREATE INDEX / REINDEX (shm_size must cover it, hence 1g).
    shm_size: 1g
    volumes:
      - raguesslighter_pgdata:/var/lib/postgresql/data
      - ./schema:/docker-entrypoint-initdb.d:ro,z  # :z = SELinux relabel (required under $HOME on Fedora)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U raguesslighter -d raguesslighter"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  raguesslighter_pgdata: